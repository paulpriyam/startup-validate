[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "india-startup-validator-skill"
version = "0.1.0"
description = "Kilo skill for validating startup ideas in the Indian market."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["kilo", "skill", "startup", "validation", "india", "ai-agent"]
authors = [
  { name = "India Startup Validator contributors" }
]

[project.scripts]
india-startup-validator-skill = "india_startup_validator_skill.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/india_startup_validator_skill"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "india_startup_validator_skill/skills"

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "skills/",
  "README.md",
  "LICENSE",
  "pyproject.toml"
]
